name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
env:
  # ===== إعلانات AdMob: استبدل هذين السطرين بمعرّفاتك الحقيقية =====
  ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713
  ADMOB_BANNER_ID: ca-app-pub-3940256099942544/6300978111
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Android project
        run: |
          set -e
          A=android; M=$A/app/src/main
          mkdir -p $M/java/com/nizar/qurannazr $M/assets $M/res/values $M/res/values-night $M/res/drawable $M/res/mipmap-anydpi-v26
          F=$(for f in quran-app*.html; do v=$(grep -o 'nazr-version" content="[0-9]*' "$f" | grep -o '[0-9]*$' || true); echo "${v:-0} $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
          echo "Using: $F"; cp "$F" $M/assets/index.html
          for e in quran-uthmani ar.muyassar quran-simple-clean; do
            curl -fsSL --retry 5 --retry-delay 5 -o "$e.json" "https://api.alquran.cloud/v1/quran/$e"
          done
          curl -fsSL --retry 5 --retry-delay 5 -o ar.jalalayn.json "https://api.alquran.cloud/v1/quran/ar.jalalayn" || echo "jalalayn skipped"
          curl -fsSL --retry 5 --retry-delay 5 -o en.sahih.json "https://api.alquran.cloud/v1/quran/en.sahih" || echo "english skipped"
          curl -fsSL --retry 3 -o $M/assets/AmiriQuran.ttf "https://github.com/google/fonts/raw/main/ofl/amiriquran/AmiriQuran-Regular.ttf" || echo "font skipped"
          python3 - "$M/assets/quran.json" <<'PY'
          import json, re, sys
          def load(e): return json.load(open(e + ".json", encoding="utf-8"))["data"]["surahs"]
          U, T, C = load("quran-uthmani"), load("ar.muyassar"), load("quran-simple-clean")
          D = re.compile("[\u064B-\u065F\u0670\u06D6-\u06ED\u0640\ufeff]")
          nm = lambda s: re.sub("[\u0671\u0623\u0625\u0622]", "\u0627", D.sub("", s))
          S, A = [], []
          for su, st, sc in zip(U, T, C):
              S.append({"number": su["number"], "name": su["name"], "en": su.get("englishName", ""), "revelationType": su["revelationType"], "numberOfAyahs": len(su["ayahs"])})
              for x, y, z in zip(su["ayahs"], st["ayahs"], sc["ayahs"]):
                  t, c = x["text"].lstrip("\ufeff"), z["text"].lstrip("\ufeff")
                  if x["numberInSurah"] == 1 and su["number"] not in (1, 9):
                      if nm(t).startswith("\u0628\u0633\u0645"): t = " ".join(t.split(" ")[4:])
                      if nm(c).startswith("\u0628\u0633\u0645"): c = " ".join(c.split(" ")[4:])
                  A.append([su["number"], x["numberInSurah"], x["page"], x["juz"], t, y["text"], c])
          assert len(S) == 114 and len(A) == 6236, (len(S), len(A))
          assert max(a[2] for a in A) == 604
          json.dump({"s": S, "a": A}, open(sys.argv[1], "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
          print("Quran data OK:", len(A), "ayahs")
          import os
          if os.path.exists("ar.jalalayn.json"):
              try:
                  J = [x["text"] for su in load("ar.jalalayn") for x in su["ayahs"]]
                  assert len(J) == 6236
                  json.dump(J, open(os.path.join(os.path.dirname(sys.argv[1]), "jalalayn.json"), "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
                  print("Jalalayn OK")
              except Exception as e:
                  print("Jalalayn skipped:", e)
          if os.path.exists("en.sahih.json"):
              try:
                  E = [x["text"].lstrip("\ufeff") for su in load("en.sahih") for x in su["ayahs"]]
                  assert len(E) == 6236
                  json.dump(E, open(os.path.join(os.path.dirname(sys.argv[1]), "en.json"), "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
                  print("English (Saheeh International) OK")
              except Exception as e:
                  print("English skipped:", e)
          PY
          cat > $A/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "QuranNazr"
          include(":app")
          EOF
          echo 'plugins { id("com.android.application") version "8.11.1" apply false }' > $A/build.gradle.kts
          printf 'org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\nandroid.suppressUnsupportedCompileSdk=36\n' > $A/gradle.properties
          cat > $A/app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "com.nizar.qurannazr"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.nizar.qurannazr"
                  minSdk = 26
                  targetSdk = 36
                  // رقم الإصدار يرتفع تلقائياً مع كل بناء
                  versionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt() + 100
                  versionName = "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              signingConfigs {
                  create("upload") {
                      storeFile = file("upload.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      if (System.getenv("KEYSTORE_PASSWORD") != null) signingConfig = signingConfigs.getByName("upload")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation("com.google.android.gms:play-services-ads:23.3.0")
          }
          EOF
          cat > $M/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher" android:label="@string/app_name"
                  android:supportsRtl="true" android:theme="@style/AppTheme">
                  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="__ADMOB_APP_ID__" />
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > $M/java/com/nizar/qurannazr/MainActivity.java <<'EOF'
          package com.nizar.qurannazr;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.window.OnBackInvokedDispatcher;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import com.google.android.gms.ads.AdListener;
          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.AdSize;
          import com.google.android.gms.ads.AdView;
          import com.google.android.gms.ads.LoadAdError;
          import com.google.android.gms.ads.MobileAds;
          import com.google.android.gms.ads.RequestConfiguration;
          import java.io.ByteArrayInputStream;
          import java.util.HashMap;
          public class MainActivity extends Activity {
              private static final String BANNER_ID = "__ADMOB_BANNER_ID__";
              private WebView web;
              private FrameLayout adBox;
              private LinearLayout root;
              private AdView adView;
              private final Handler handler = new Handler(Looper.getMainLooper());
              public class Bridge {
                  @JavascriptInterface public void setBrightness(final float v) {
                      runOnUiThread(() -> {
                          WindowManager.LayoutParams lp = getWindow().getAttributes();
                          lp.screenBrightness = v < 0 ? WindowManager.LayoutParams.BRIGHTNESS_OVERRIDE_NONE : Math.max(0.02f, Math.min(1f, v));
                          getWindow().setAttributes(lp);
                      });
                  }
                  @JavascriptInterface public void keepOn(final boolean on) {
                      runOnUiThread(() -> {
                          if (on) getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          else getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      });
                  }
                  @JavascriptInterface public void share(final String text) {
                      runOnUiThread(() -> {
                          Intent i = new Intent(Intent.ACTION_SEND);
                          i.setType("text/plain");
                          i.putExtra(Intent.EXTRA_TEXT, text);
                          startActivity(Intent.createChooser(i, "مشاركة"));
                      });
                  }
                  @JavascriptInterface public void setDark(final boolean dark) {
                      runOnUiThread(() -> applyBars(dark));
                  }
              }
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setTextZoom(100);
                  web.addJavascriptInterface(new Bridge(), "NazrApp");
                  web.setWebViewClient(new WebViewClient() {
                      @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if (!"qurannazr.local".equals(u.getHost())) return null;
                          String p = u.getPath();
                          if (p == null || p.equals("/")) p = "/index.html";
                          String name = p.substring(1);
                          String mime = name.endsWith(".html") ? "text/html" : name.endsWith(".json") ? "application/json"
                                  : name.endsWith(".ttf") ? "font/ttf" : "application/octet-stream";
                          try {
                              return new WebResourceResponse(mime, "UTF-8", getAssets().open(name));
                          } catch (Exception e) {
                              return new WebResourceResponse("text/plain", "UTF-8", 404, "Not Found",
                                      new HashMap<String, String>(), new ByteArrayInputStream(new byte[0]));
                          }
                      }
                  });

                  // الصفحة في الأعلى، والإعلان شريط صغير تحتها (لا يغطي أي آية)
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  // Android 15+ يرسم التطبيق تحت شريط الحالة والتنقل: نبعد المحتوى عنهما
                  root.setOnApplyWindowInsetsListener((v, insets) -> {
                      if (Build.VERSION.SDK_INT >= 30) {
                          android.graphics.Insets i = insets.getInsets(WindowInsets.Type.systemBars() | WindowInsets.Type.displayCutout());
                          v.setPadding(i.left, i.top, i.right, i.bottom);
                      }
                      return insets;
                  });
                  root.addView(web, new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));
                  adBox = new FrameLayout(this);
                  adBox.setBackgroundColor(Color.parseColor("#EDF1EB"));
                  adBox.setVisibility(View.GONE);
                  root.addView(adBox, new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                  setContentView(root);
                  int night = getResources().getConfiguration().uiMode & android.content.res.Configuration.UI_MODE_NIGHT_MASK;
                  applyBars(night == android.content.res.Configuration.UI_MODE_NIGHT_YES);
                  web.loadUrl("https://qurannazr.local/index.html");

                  // زر الرجوع في Android 13+ (إلزامي في Android 16)
                  if (Build.VERSION.SDK_INT >= 33) {
                      getOnBackInvokedDispatcher().registerOnBackInvokedCallback(
                              OnBackInvokedDispatcher.PRIORITY_DEFAULT, this::goBack);
                  }

                  // إعلانات مناسبة لكل الأعمار فقط
                  MobileAds.setRequestConfiguration(new RequestConfiguration.Builder()
                          .setMaxAdContentRating(RequestConfiguration.MAX_AD_CONTENT_RATING_G).build());
                  new Thread(() -> MobileAds.initialize(this, st -> runOnUiThread(this::setupBanner))).start();
              }
              private void setupBanner() {
                  try {
                      adView = new AdView(this);
                      adView.setAdUnitId(BANNER_ID);
                      DisplayMetrics dm = getResources().getDisplayMetrics();
                      int widthDp = (int) (dm.widthPixels / dm.density);
                      adView.setAdSize(AdSize.getCurrentOrientationAnchoredAdaptiveBannerAdSize(this, widthDp));
                      adView.setAdListener(new AdListener() {
                          @Override public void onAdLoaded() { adBox.setVisibility(View.VISIBLE); }
                          @Override public void onAdFailedToLoad(LoadAdError e) {
                              adBox.setVisibility(View.GONE);            // بدون إنترنت: يختفي الشريط
                              handler.postDelayed(MainActivity.this::loadAd, 60000);  // يحاول مرة أخرى بعد دقيقة
                          }
                      });
                      adBox.addView(adView, new FrameLayout.LayoutParams(FrameLayout.LayoutParams.WRAP_CONTENT,
                              FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.CENTER));
                      loadAd();
                  } catch (Exception e) { adBox.setVisibility(View.GONE); }
              }
              private void applyBars(boolean dark) {
                  int bg = dark ? Color.parseColor("#0D1715") : Color.parseColor("#EDF1EB");
                  root.setBackgroundColor(bg);
                  adBox.setBackgroundColor(bg);
                  if (Build.VERSION.SDK_INT >= 30) {
                      WindowInsetsController c = getWindow().getInsetsController();
                      if (c != null) {
                          int light = WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS | WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS;
                          c.setSystemBarsAppearance(dark ? 0 : light, light);
                      }
                  }
              }
              private void goBack() {
                  if (web != null && web.canGoBack()) web.goBack(); else finish();
              }
              private void loadAd() { if (adView != null) adView.loadAd(new AdRequest.Builder().build()); }
              @Override protected void onPause() { if (adView != null) adView.pause(); super.onPause(); }
              @Override protected void onResume() { super.onResume(); if (adView != null) adView.resume(); }
              @Override protected void onDestroy() { handler.removeCallbacksAndMessages(null); if (adView != null) adView.destroy(); super.onDestroy(); }
              @Override public void onBackPressed() { goBack(); }   // Android 12 وما قبله
          }
          EOF
          sed -i "s|__ADMOB_APP_ID__|$ADMOB_APP_ID|" $M/AndroidManifest.xml
          sed -i "s|__ADMOB_BANNER_ID__|$ADMOB_BANNER_ID|" $M/java/com/nizar/qurannazr/MainActivity.java
          echo "AdMob app: $ADMOB_APP_ID / banner: $ADMOB_BANNER_ID"
          echo '<resources><string name="app_name">القرآن الكريم نزر</string></resources>' > $M/res/values/strings.xml
          echo '<resources><color name="icon_bg">#12302B</color><color name="bg_light">#EDF1EB</color><color name="bg_dark">#0D1715</color></resources>' > $M/res/values/colors.xml
          cat > $M/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">@color/bg_light</item>
                  <item name="android:navigationBarColor">@color/bg_light</item>
                  <item name="android:windowBackground">@color/bg_light</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF
          cat > $M/res/values-night/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">@color/bg_dark</item>
                  <item name="android:navigationBarColor">@color/bg_dark</item>
                  <item name="android:windowBackground">@color/bg_dark</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF
          cat > $M/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF
          cat > $M/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#D4AF5A" android:pathData="M53,42 C45,37 37,36 30,38 L30,72 C37,70 45,71 53,76 Z" />
              <path android:fillColor="#D4AF5A" android:pathData="M55,42 C63,37 71,36 78,38 L78,72 C71,70 63,71 55,76 Z" />
              <path android:fillColor="#12302B" android:pathData="M35,47 L48,49 L48,51 L35,49 Z M35,54 L48,56 L48,58 L35,56 Z M60,49 L73,47 L73,49 L60,51 Z M60,56 L73,54 L73,56 L60,58 Z" />
              <path android:fillColor="#D4AF5A" android:pathData="M54,26 L56.5,31 L62,31.5 L58,35 L59.2,40.5 L54,37.6 L48.8,40.5 L50,35 L46,31.5 L51.5,31 Z" />
          </vector>
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK + AAB
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > app/upload.jks
            echo "Signing with the permanent upload key"
            gradle assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk ../quran-nazr.apk
            cp app/build/outputs/bundle/release/app-release.aab ../quran-nazr.aab
            rm -f app/upload.jks
          else
            echo "::warning::Signing secrets not found - building a temporary debug APK"
            unset KEYSTORE_PASSWORD
            gradle assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../quran-nazr.apk
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: القرآن الكريم نزر
          body: آخر نسخة من التطبيق
          files: |
            quran-nazr.apk
            quran-nazr.aab
          fail_on_unmatched_files: false
          make_latest: true
