<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="nazr-version" content="4">
<title>القرآن الكريم نزر</title>
<style>
@font-face{font-family:"Amiri Quran";src:url("AmiriQuran.ttf")}
:root{
  --bg:#EDF1EB;--paper:#FBFAF3;--paper2:#ECE7D6;--ink:#12302B;--muted:#62756E;--gold:#A87B22;--line:#D3DCD3;--accent:#1D5A4F;--hl:#F2E4BF;
  --dr:#10231F;--drink:#EDE8D8;--drline:#23403A;
  --qfont:"Amiri Quran","Amiri","Traditional Arabic",serif;--ui:system-ui,"Noto Sans Arabic",Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1715;--paper:#16231F;--paper2:#0F1A17;--ink:#E4E2D4;--muted:#93A39D;--gold:#D4AF5A;--line:#24403B;--accent:#7FC3B3;--hl:#3A3420;--dr:#0A1412;--drline:#1C322D}}
:root[data-theme="dark"]{--bg:#0D1715;--paper:#16231F;--paper2:#0F1A17;--ink:#E4E2D4;--muted:#93A39D;--gold:#D4AF5A;--line:#24403B;--accent:#7FC3B3;--hl:#3A3420;--dr:#0A1412;--drline:#1C322D}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== القارئ ===== */
.reader{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.rtop,.rbot{display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:13px;color:var(--muted);flex:none}
.rtop{justify-content:space-between}
.rtop b{flex:1;text-align:center;font-family:var(--qfont);font-weight:400;font-size:20px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
.ibtn:active{background:var(--line)}
.rjuz{min-width:40px;text-align:left}
.rbot{justify-content:space-between}
.rbtn{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--accent)}
.rbtn:disabled{opacity:.3}
.pnum{font-weight:600;color:var(--ink);font-size:15px}

/* المسرح والأوراق */
.stage{flex:1;min-height:0;position:relative;user-select:none;-webkit-user-select:none;margin:0 6px 0 4px;perspective:2200px;perspective-origin:50% 50%;touch-action:none;overflow:hidden}
.leaf{position:absolute;inset:0 0 0 7px;transform-origin:right center;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{transform:rotateY(180deg);background:linear-gradient(to left,var(--paper2),var(--paper) 35%,var(--paper2));border:1px solid var(--line);border-radius:4px}
.pagebox{position:absolute;inset:0;padding:8px 10px;background:var(--paper);
  border:3px double var(--gold);border-radius:3px 6px 6px 3px;
  box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--line),
    -2px 0 0 0 var(--paper),-3px 0 0 0 var(--line),-5px 0 0 0 var(--paper),-6px 0 0 0 var(--line);
  overflow:hidden;display:flex;align-items:center}
.pagebox::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to left,rgb(0 0 0/.13),rgb(0 0 0/0) 6%),linear-gradient(to right,rgb(0 0 0/.05),rgb(0 0 0/0) 3%)}
.fshade,.ushade{position:absolute;inset:0;pointer-events:none;opacity:0;border-radius:4px}
.fshade{background:linear-gradient(to left,rgb(0 0 0/.28),rgb(0 0 0/0) 45%,rgb(255 255 255/.10) 75%,rgb(0 0 0/.18))}
.ushade{background:linear-gradient(to left,rgb(0 0 0/.38),rgb(0 0 0/.08) 40%,rgb(0 0 0/0) 70%)}

.page{width:100%;font-family:var(--qfont);line-height:2.05;text-align:justify;text-align-last:center;color:var(--ink);position:relative}
.page.short{text-align:center}
.shead{display:flex;align-items:center;gap:6px;margin:4px 0 2px;padding:4px;line-height:1.2;
  border:2px solid var(--gold);border-radius:3px;background:repeating-linear-gradient(45deg,#1d6b3b 0 5px,#2d8a50 5px 10px)}
.shead .c{flex:1;background:var(--paper);border:2px solid var(--gold);border-radius:999px;text-align:center;
  font-family:var(--qfont);font-size:21px;padding:3px 0 5px;color:var(--ink)}
.shead .o{width:36px;height:36px;flex:none;border-radius:50%;background:var(--paper);border:2px solid var(--gold);
  display:grid;place-items:center;font-family:var(--ui);font-size:9px;line-height:1.15;text-align:center;color:var(--ink)}
.page .basmala{display:block;text-align:center;margin:0}
.ayah{cursor:pointer;border-radius:6px;transition:background .3s}
.ayah.hl{background:var(--hl)}
.ayah.marked{background:var(--hl);box-shadow:inset 0 -2px 0 var(--gold)}
.am{display:inline-grid;place-items:center;width:1.45em;height:1.45em;margin:0 .1em;vertical-align:middle;
  border:1.5px solid var(--gold);border-radius:50%;font-family:var(--ui);font-size:.6em;line-height:1;color:var(--ink);
  background:radial-gradient(circle,var(--paper) 55%,transparent 56%),conic-gradient(var(--gold) 0 25%,transparent 0 50%,var(--gold) 0 75%,transparent 0)}
.am.fav{border-color:var(--accent);color:var(--accent)}

/* ===== القائمة الجانبية ===== */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.45);z-index:29;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(84vw,340px);z-index:30;background:var(--dr);color:var(--drink);
  transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-8px 0 24px rgb(0 0 0/.3)}
.drawer.open{transform:none}
.dhead{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--drline)}
.dhead b{font-family:var(--qfont);font-weight:400;font-size:24px;flex:1}
.dhead small{display:block;font-size:12px;color:#B9B19A;font-family:var(--ui)}
.dlist{flex:1;overflow:auto}
.ditem{display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;border-bottom:1px solid var(--drline);font-size:17px;text-align:right}
.ditem svg{color:#D4AF5A}
.ditem:active{background:var(--drline)}
.ditem .st{margin-inline-start:auto;font-size:12px;color:#B9B19A}
.dsec{padding:12px 18px 4px;font-size:12px;color:#B9B19A}

/* ===== اللوحات ===== */
.panel{position:fixed;inset:0;z-index:31;background:var(--bg);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .28s ease;padding-top:env(safe-area-inset-top,0px)}
.panel.open{transform:none}
.phead{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
.phead h2{flex:1;margin:0;font-size:18px}
.pbody{flex:1;overflow:auto;padding:12px 14px calc(30px + env(safe-area-inset-bottom,0px))}
.input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit;font-size:16px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:11px 4px;border-bottom:1px solid var(--line)}
.num{width:34px;height:34px;flex:none;display:grid;place-items:center;font-size:13px;color:var(--gold);border:1.5px solid var(--gold);transform:rotate(45deg);border-radius:6px}
.num span{transform:rotate(-45deg)}
.row .name{font-family:var(--qfont);font-size:21px;line-height:1.5}
.row .meta{font-size:12px;color:var(--muted)}
.row .pg{font-size:13px;color:var(--muted)}
.grow{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.cell{padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:var(--paper);text-align:center;line-height:1.5}
.cell b{display:block;font-size:15px}
.cell span{font-size:12px;color:var(--muted)}
.btn{padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-weight:600}
.btn.primary{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.res{display:block;width:100%;text-align:right;padding:12px 4px;border-bottom:1px solid var(--line)}
.res .t{font-family:var(--qfont);font-size:20px;line-height:1.9}
.res .s{font-size:12px;color:var(--gold)}
.note{color:var(--muted);text-align:center;padding:24px 10px;line-height:1.9}
.searchbox{display:flex;gap:8px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:600;color:var(--muted)}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.tf-item{padding:10px 0 14px;border-bottom:1px solid var(--line)}
.tf-item .q{font-family:var(--qfont);font-size:21px;line-height:1.9}
.tf-item .tf{line-height:1.9;margin-top:4px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;line-height:1.9}
.card .q{font-family:var(--qfont);font-size:22px;line-height:2}
.card small{display:block;color:var(--gold);font-size:12px}
.mrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.mrow .res{border:0;flex:1}
.del{width:36px;height:36px;border-radius:50%;color:var(--muted)}
.del:active{background:var(--line)}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.big{font-size:42px;text-align:center;font-weight:700;margin:6px 0 0}
.bigsub{text-align:center;color:var(--muted);margin:0 0 14px;font-family:var(--qfont);font-size:20px}

/* ===== ورقة الآية (كما هي) ===== */
.sheet{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--paper);border-radius:18px 18px 0 0;max-height:80%;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s}
.sheet.open{transform:none}
.sheet .q{font-family:var(--qfont);font-size:24px;line-height:2}
.sheet h3{font-size:14px;color:var(--gold);margin:14px 0 4px}
.sheet .tf{line-height:1.9}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.toast{position:fixed;bottom:calc(60px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;z-index:50;pointer-events:none;white-space:nowrap}
.dim{position:fixed;inset:0;background:#000;pointer-events:none;z-index:60;opacity:0}
@media (prefers-reduced-motion:reduce){.drawer,.panel,.sheet,.scrim{transition:none}}
</style>
</head>
<body>
<div class="reader" id="reader">
  <div class="rtop">
    <button class="ibtn" id="menuBtn" aria-label="القائمة الرئيسية"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <b id="rname"></b>
    <span class="rjuz" id="rjuz"></span>
  </div>
  <div class="stage" id="stage"></div>
  <div class="rbot">
    <button class="rbtn" id="prev">السابقة</button>
    <span class="pnum" id="pnum"></span>
    <button class="rbtn" id="next">التالية</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="القائمة الرئيسية">
  <div class="dhead"><b>القرآن الكريم نزر<small>القائمة الرئيسية</small></b>
    <button class="ibtn" id="dclose" aria-label="إغلاق" style="color:var(--drink)"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dlist" id="dlist"></div>
</aside>
<section class="panel" id="panel" role="dialog" aria-modal="true"></section>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<div class="dim" id="dim"></div>

<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.replace(/[ً-ٰٟۖ-ۭـ]/g,'').replace(/[ٱأإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
const sname=n=>n.replace(/^سُورَةُ\s*/,'');
const BASMALA='بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ';
const NA=window.NazrApp||null;   /* جسر أندرويد (السطوع، إبقاء الشاشة، المشاركة) */
const APP_LINK='https://github.com/nizarmhadi15-maker/QuranNazr/releases/download/latest/quran-nazr.apk';
const stage=$('#stage');
let Q=null,cur=null,busy=false;

function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,1800)}
const I={
  heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  book:'<path d="M3 5.5C5.5 4.5 8.5 4.5 12 6c3.5-1.5 6.5-1.5 9-.5V19c-2.5-1-5.5-1-9 .5-3.5-1.5-6.5-1.5-9-.5z"/><path d="M12 6v13.5"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  pie:'<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',
  pages:'<rect x="5" y="3" width="12" height="16" rx="1.5"/><path d="M8 7h6M8 10.5h6M8 14h4M19 7v13a1 1 0 0 1-1 1H8"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  bmAdd:'<path d="M6 3h12v18l-6-4.5L6 21z"/><path d="M12 7v6M9 10h6"/>',
  bmGo:'<path d="M6 3h12v18l-6-4.5L6 21z"/><path d="M10 8l3 3-3 3"/>',
  bms:'<path d="M5 6h11v15l-5.5-4L5 21z"/><path d="M9 3h10v14"/>',
  star:'<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.8z"/>',
  dua:'<path d="M7 21v-6.5L4.5 9a1.5 1.5 0 0 1 2.6-1.4L10 12V4.5a1.5 1.5 0 0 1 3 0V12"/><path d="M13 9.5a1.5 1.5 0 0 1 3 0v1a1.5 1.5 0 0 1 3 0V16a5 5 0 0 1-5 5h-3"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
  moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>',
  share:'<circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4M8.2 13.2l7.6 4"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${I[n]}</svg>`;

/* ===== البيانات (المصحف كاملاً داخل التطبيق) ===== */
async function loadData(){
  if(Q)return;
  const r=await fetch('quran.json');Q=await r.json();
  Q.byPage={};Q.idx={};Q.sp={};Q.juz={};
  Q.a.forEach((x,i)=>{(Q.byPage[x[2]]||(Q.byPage[x[2]]=[])).push(i);Q.idx[x[0]+':'+x[1]]=i;
    if(x[1]===1)Q.sp[x[0]]=x[2];if(!Q.juz[x[3]])Q.juz[x[3]]={p:x[2],s:x[0],a:x[1]}});
}
const ayahAt=(s,a)=>Q.a[Q.idx[s+':'+a]];
const pageOf=(s,a)=>ayahAt(s,a)[2];
function pageData(p){return Q.byPage[p].map(i=>{const x=Q.a[i];return{i,s:x[0],n:Q.s[x[0]-1].name,a:x[1],j:x[3],t:x[4],f:x[5]}})}
let JAL;async function loadJal(){if(JAL!==undefined)return JAL;try{const r=await fetch('jalalayn.json');JAL=r.ok?await r.json():null}catch(e){JAL=null}return JAL}

/* العلامات والمفضلة */
const bms=()=>store.get('bms',[]);
const isMark=(s,a)=>bms().some(b=>b.k==='ayah'&&b.s===s&&b.a===a);
const favs=()=>store.get('favs',[]);
const isFav=(s,a)=>favs().some(f=>f.s===s&&f.a===a);
(function migrate(){const m=store.get('mark',null);if(m){const b=bms();b.unshift({k:'ayah',p:m.p,s:m.s,a:m.a,n:m.n,t:Date.now()});store.set('bms',b);store.set('mark',null)}})();

/* ===== بناء الورقة ===== */
function makeLeaf(p){
  const d=pageData(p);let body='';
  d.forEach((x,k)=>{
    let t=x.t;
    if(x.a===1){
      body+=`<span class="shead"><span class="o">ترتيبها<br>${ar(x.s)}</span><span class="c">سُورَةُ ${esc(sname(x.n))}</span><span class="o">آياتها<br>${ar(Q.s[x.s-1].numberOfAyahs)}</span></span>`;
      if(x.s!==1&&x.s!==9){if(norm(t).startsWith('بسم'))t=t.split(' ').slice(4).join(' ');body+=`<span class="basmala">${BASMALA}</span>`}
    }
    body+=`<span class="ayah${isMark(x.s,x.a)?' marked':''}" data-sa="${x.s}:${x.a}" data-k="${k}">${esc(t)}<span class="am${isFav(x.s,x.a)?' fav':''}">${ar(x.a)}</span></span> `;
  });
  const el=document.createElement('div');el.className='leaf';el.dataset.p=p;el._d=d;
  el.innerHTML=`<div class="face front"><div class="pagebox"><div class="page${p<=2?' short':''}">${body}</div></div><div class="ushade"></div><div class="fshade"></div></div><div class="face back"></div>`;
  return el;
}
/* أكبر خط تتسع له الصفحة بلا تمرير */
function fit(el){
  const box=el.querySelector('.pagebox'),m=el.querySelector('.page');
  const cs=getComputedStyle(box),H=box.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  let lo=10,hi=+el.dataset.p<=2?34:30;
  for(let k=0;k<14;k++){const mid=(lo+hi)/2;m.style.fontSize=mid+'px';if(m.offsetHeight<=H)lo=mid;else hi=mid}
  m.style.fontSize=lo+'px';
}
function setCur(leaf){
  const p=+leaf.dataset.p,d=leaf._d;cur={p,d,leaf};
  $('#rname').textContent=[...new Set(d.map(x=>sname(x.n)))].join(' - ');
  $('#rjuz').textContent='الجزء '+ar(d[0].j);
  $('#pnum').textContent=ar(p);
  $('#prev').disabled=p<=1;$('#next').disabled=p>=604;
  store.set('last',{p,n:d[0].n});
  try{history.replaceState(history.state,'','#p/'+p)}catch(e){}
}
function show(p){stage.innerHTML='';const l=makeLeaf(p);stage.append(l);fit(l);setCur(l)}
function highlight(s,a){if(!s||!cur)return;const el=cur.leaf.querySelector(`[data-sa="${s}:${a}"]`);if(el){el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),2500)}}

/* ===== تقليب الصفحات مثل الكتاب =====
   الكعب على اليمين؛ الصفحة التالية تحت الصفحة الحالية، وتنقلب الحالية حول الكعب */
const ANG=-180;
function startFlip(dir,target){
  const n=target||cur.p+dir;if(n<1||n>604||n===cur.p)return null;
  const nl=makeLeaf(n);let f;
  if(dir>0){nl.style.zIndex=1;cur.leaf.style.zIndex=2;stage.insertBefore(nl,cur.leaf);f={dir,top:cur.leaf,under:nl,nl}}
  else{nl.style.zIndex=2;cur.leaf.style.zIndex=1;stage.append(nl);f={dir,top:nl,under:cur.leaf,nl}}
  fit(nl);setT(f,0);return f;
}
function setT(f,t){
  const fold=(f.dir>0?t:1-t)*.5;  /* ٠ = الورقة مسطّحة، ٠٫٥ = قائمة على الكعب */
  f.top.style.transform=`rotateY(${fold*ANG}deg)`;
  f.top.querySelector('.fshade').style.opacity=Math.min(1,fold*2.6).toFixed(3);
  f.under.querySelector('.ushade').style.opacity=(Math.sin(fold*2*Math.PI)*.95).toFixed(3);
}
function endFlip(f,complete,dur,cb){
  busy=true;
  const els=[f.top,f.top.querySelector('.fshade'),f.under.querySelector('.ushade')];
  els.forEach(e=>e.style.transition=`transform ${dur}ms cubic-bezier(.3,.6,.35,1),opacity ${dur}ms ease`);
  requestAnimationFrame(()=>setT(f,complete?1:0));
  setTimeout(()=>{
    els.forEach(e=>e.style.transition='');
    const keep=complete?f.nl:cur.leaf,drop=complete?(f.dir>0?f.top:f.under):f.nl;
    drop.remove();keep.style.transform='';keep.style.zIndex='';
    keep.querySelector('.fshade').style.opacity=0;keep.querySelector('.ushade').style.opacity=0;
    if(complete)setCur(keep);
    busy=false;cb&&cb();
  },dur+40);
}
function turn(dir){if(busy||!cur)return;const f=startFlip(dir);if(f)endFlip(f,true,520)}
function goTo(p,s,a){
  p=Math.min(604,Math.max(1,p));
  if(!cur){show(p);highlight(s,a);return}
  if(p===cur.p){highlight(s,a);return}
  if(busy)return;
  const f=startFlip(p>cur.p?1:-1,p);endFlip(f,true,620,()=>highlight(s,a));
}

/* السحب بالإصبع: الورقة تتبع الإصبع */
let ps=null,dragEnd=0;
stage.addEventListener('pointerdown',e=>{if(busy||!cur)return;ps={x:e.clientX,y:e.clientY,f:null,t:0,lx:e.clientX,lt:e.timeStamp,v:0}});
stage.addEventListener('pointermove',e=>{
  if(!ps)return;const dx=e.clientX-ps.x,dy=e.clientY-ps.y;
  if(!ps.f){
    if(Math.abs(dx)<10||Math.abs(dx)<Math.abs(dy))return;
    ps.dir=dx>0?1:-1;ps.f=startFlip(ps.dir);
    if(!ps.f){ps=null;return}
    try{stage.setPointerCapture(e.pointerId)}catch(_){}
  }
  const W=stage.clientWidth,t=Math.max(0,Math.min(1,(dx*ps.dir)/(W*.9)));
  ps.v=(e.clientX-ps.lx)/Math.max(1,e.timeStamp-ps.lt)*ps.dir;ps.lx=e.clientX;ps.lt=e.timeStamp;
  ps.t=t;setT(ps.f,t);
});
function release(){
  if(!ps)return;const s=ps;ps=null;if(!s.f)return;
  dragEnd=Date.now();
  const done=s.t>.3||s.v>.45;
  endFlip(s.f,done,Math.round(done?(1-s.t)*480+140:s.t*420+120));
}
stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);
stage.addEventListener('click',e=>{
  if(Date.now()-dragEnd<350||busy)return;
  const el=e.target.closest('.ayah');if(el&&cur.leaf.contains(el))openAyah(+el.dataset.k);
});
$('#next').onclick=()=>turn(1);$('#prev').onclick=()=>turn(-1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')turn(1);if(e.key==='ArrowRight')turn(-1)});
addEventListener('resize',()=>{if(cur&&!busy)fit(cur.leaf)});

let ovOpen=false;

function closeAll(){$('#drawer').classList.remove('open');$('#panel').classList.remove('open');$('#sheet').classList.remove('open');$('#scrim').classList.remove('on');ovOpen=false}
function closeOv(){if(ovOpen&&history.state&&history.state.ov)history.back();else closeAll()}
addEventListener('popstate',()=>{if(ovOpen)closeAll()});
$('#scrim').onclick=closeOv;$('#dclose').onclick=closeOv;
function closeThen(fn){closeOv();setTimeout(fn,260)}

/* ===== ورقة الآية (التفسير الميسّر — كما هي) ===== */
function openAyah(k){
  const x=cur.d[k],p=cur.p,sh=$('#sheet');
  const elA=()=>cur.leaf.querySelector(`[data-sa="${x.s}:${x.a}"]`);
  const draw=()=>{const fav=isFav(x.s,x.a),mk=isMark(x.s,x.a);
    sh.innerHTML=`<div class="q">${esc(x.t)} <span style="color:var(--gold)">﴿${ar(x.a)}﴾</span></div>
    <p style="color:var(--muted);font-size:12px;margin:0">${esc(x.n)} - صفحة ${ar(p)}</p>
    <h3>التفسير الميسّر</h3><div class="tf">${esc(x.f)}</div>
    <div class="actions">
      <button class="btn primary" id="mkBtn">${mk?'إزالة علامة القراءة':'🔖 ضع علامة القراءة هنا'}</button>
      <button class="btn" id="favBtn">${fav?'إزالة من المفضلة':'حفظ في المفضلة'}</button>
      <button class="btn" id="copyBtn">نسخ الآية</button><button class="btn" id="closeBtn">إغلاق</button></div>`;
    $('#mkBtn').onclick=()=>{let b=bms();
      if(mk){b=b.filter(y=>!(y.k==='ayah'&&y.s===x.s&&y.a===x.a));toast('أُزيلت علامة القراءة')}
      else{b.unshift({k:'ayah',p,s:x.s,a:x.a,n:x.n,t:Date.now()});toast('وُضعت العلامة')}
      store.set('bms',b);const e=elA();if(e)e.classList.toggle('marked',!mk);draw()};
    $('#favBtn').onclick=()=>{let f=favs();
      if(fav){f=f.filter(y=>!(y.s===x.s&&y.a===x.a));toast('أُزيلت من المفضلة')}
      else{f.unshift({s:x.s,a:x.a,p,name:x.n,t:x.t.slice(0,120)});toast('حُفظت في المفضلة')}
      store.set('favs',f);const e=elA();if(e)e.querySelector('.am').classList.toggle('fav',!fav);draw()};
    $('#copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(`${x.t} ﴿${ar(x.a)}﴾ [${x.n}]`);toast('نُسخت الآية')}catch(e){toast('تعذّر النسخ على هذا الجهاز')}};
    $('#closeBtn').onclick=closeOv;};
  draw();openOv();$('#scrim').classList.add('on');sh.classList.add('open');
}

function panel(title,html,mount){
  const p=$('#panel');
  p.innerHTML=`<div class="phead"><button class="ibtn" id="pclose" aria-label="إغلاق">${ic('x')}</button><h2>${title}</h2></div><div class="pbody" id="pbody">${html}</div>`;
  $('#drawer').classList.remove('open');$('#scrim').classList.remove('on');
  openOv();p.classList.add('open');$('#pclose').onclick=closeOv;
  if(mount)mount($('#pbody'));
}

function applyBright(v){
  if(NA&&NA.setBrightness){NA.setBrightness(v==null?-1:v/100);$('#dim').style.opacity=0}
  else $('#dim').style.opacity=v==null?0:((100-v)/100*.75).toFixed(2);
}
let wake=null;
async function applyKeepOn(on){
  if(NA&&NA.keepOn){NA.keepOn(!!on);return}
  try{if(on&&navigator.wakeLock)wake=await navigator.wakeLock.request('screen');else if(wake){wake.release();wake=null}}catch(e){}
}

  else navigator.clipboard.writeText(txt).then(()=>toast('نُسخ رابط التطبيق')).catch(()=>{});

  const th=store.get('theme',null);if(th)document.documentElement.dataset.theme=th;
  applyBright(store.get('bright',null));applyKeepOn(store.get('keepon',false));syncDark();
  try{await loadData()}catch(e){stage.innerHTML='<p class="note">تعذّر فتح بيانات المصحف. أغلق التطبيق وافتحه من جديد.</p>';return}
  const h=location.hash.slice(1).split('/');
  if(h[0]==='p'&&+h[1]){show(+h[1]);highlight(+h[2],+h[3])}
  else if(h[0]==='a'&&+h[1]){const s=+h[1],a=+h[2]||1;show(pageOf(s,a));highlight(s,a)}
  else show((store.get('last',null)||{p:1}).p);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(cur&&!busy)fit(cur.leaf)});
})();
</script>
